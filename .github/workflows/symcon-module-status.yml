name: Symcon Module Status

on:
  schedule:
    - cron: '0 6 * * *' # Täglich um 6 Uhr morgens
  workflow_dispatch:    # Manuell auslösbar

jobs:
  update-status:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Get list of repos from GitHub API
        run: |
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/users/Wilkware/repos?per_page=100" > repos.json
          cat repos.json | jq '.[] | select((.description // "") | test("Symcon Modul")) | {name: .name, clone_url: .clone_url}' > filtered_repos.json
          cat repos.json | jq '.[] | select((.description // "") | test("Symcon Skin|Symcon Tile Visu")) | {name: .name, clone_url: .clone_url}' > visu_repos.json

      - name: Create module status markdown
        run: |
          echo "| Modul | Version | Kompatibilität | Status | Tests |" > MODULE_STATUS.md
          echo "|-------|---------|----------------|--------|-------|" >> MODULE_STATUS.md

          cat filtered_repos.json | jq -c '.' | while read -r repo; do
          name=$(echo "$repo" | jq -r '.name')
          url=$(echo "$repo" | jq -r '.clone_url')

          echo "Cloning $name"

          TEMP_DIR=$(mktemp -d)

          git clone --depth=1 "$url" "$TEMP_DIR"
          git -C "$TEMP_DIR" fetch --tags

          echo "Tags found in $name:"
          git -C "$TEMP_DIR" tag --sort=-creatordate

          if [ -f "$TEMP_DIR/library.json" ]; then
            symcon=$(jq -r '.compatibility.version' "$TEMP_DIR/library.json")
            tag=$(git -C "$TEMP_DIR" tag --sort=-creatordate | head -n 1)
            version=${tag%%-*}

            if [[ "$tag" == *stable ]]; then
              typ="STABLE"
            elif [[ "$tag" == *beta ]]; then
              typ="BETA"
            elif [[ "$tag" == *testing ]]; then
              typ="TESTING"
            else
              typ="INTERNAL"
            fi

            case "$typ" in
              STABLE)   color="green" ;;
              BETA)     color="yellow" ;;
              TESTING)  color="red" ;;
              *)        color="lightgrey" ;;
            esac

            workflow_badge="-"
            if [ -f "$TEMP_DIR/.github/workflows/style.yml" ]; then
              workflow_badge="[![Action](https://img.shields.io/github/actions/workflow/status/Wilkware/$name/style.yml?label=Style&style=flat-square)](https://github.com/Wilkware/$name/actions)"
            elif [ -f "$TEMP_DIR/.github/workflows/ci.yml" ]; then
              workflow_badge="[![Action](https://img.shields.io/github/actions/workflow/status/Wilkware/$name/ci.yml?branch=main&label=CI&style=flat-square)](https://github.com/Wilkware/$name/actions)"
            fi

            echo "| [$name]($url) | $version | ![Symcon](https://img.shields.io/badge/Symcon-$symcon-blue.svg?style=flat-square) | ![$typ](https://img.shields.io/badge/$typ-$color?style=flat-square&format=png) | $workflow_badge |" >> MODULE_STATUS.md
          else
            echo "| [$name]($url) | - | - | - | - |" >> MODULE_STATUS.md
          fi
          sync
          sleep 1
          rm -rf "$TEMP_DIR"
          done

      - name: Create visualization status markdown
        run: |
          echo "| Name | Version | Kompatibilität | Typ |" > VISU_STATUS.md
          echo "|------|---------|----------------|-----|" >> VISU_STATUS.md

          cat visu_repos.json | jq -c '.' | while read -r repo; do
          name=$(echo "$repo" | jq -r '.name')
          url=$(echo "$repo" | jq -r '.clone_url')

          echo "Cloning $name"

          TEMP_DIR=$(mktemp -d)

          git clone --depth=1 "$url" "$TEMP_DIR"

          if [ -f "$TEMP_DIR/README.md" ]; then
            # Values are taken from the shields.io badges in the README header
            typ=$(grep -o -m1 'badge/Symcon-[^?]*-red' "$TEMP_DIR/README.md" | sed -e 's#badge/Symcon-##' -e 's#-red$##')
            symcon=$(grep -o -m1 'badge/Symcon%20Version-[^-]*-' "$TEMP_DIR/README.md" | sed -e 's#badge/Symcon%20Version-##' -e 's#-$##')
            version=$(grep -o -m1 'badge/Skin%20Version-[^-]*-' "$TEMP_DIR/README.md" | sed -e 's#badge/Skin%20Version-##' -e 's#-$##')

            typ_badge="-"
            [ -n "$typ" ] && typ_badge="![${typ//--/-}](https://img.shields.io/badge/Symcon-$typ-red.svg?style=flat-square)"
            symcon_badge="-"
            [ -n "$symcon" ] && symcon_badge="![Symcon](https://img.shields.io/badge/Symcon-$symcon-blue.svg?style=flat-square)"
            [ -n "$version" ] && version="v$version" || version="-"

            echo "| [$name]($url) | $version | $symcon_badge | $typ_badge |" >> VISU_STATUS.md
          else
            echo "| [$name]($url) | - | - | - |" >> VISU_STATUS.md
          fi
          sync
          sleep 1
          rm -rf "$TEMP_DIR"
          done

      - name: Update README.md with module and visualization status
        run: |
            replace_section() {
              local marker="$1"
              local file="$2"
              awk -v repl="$(cat "$file")" -v start="<!-- $marker START -->" -v stop="<!-- $marker END -->" '
              BEGIN { inside=0 }
              index($0, start) { print; print repl; inside=1; next }
              index($0, stop) { inside=0 }
              !inside
              ' README.md > README.tmp && mv README.tmp README.md
            }
            replace_section "SYMCON MODULE" MODULE_STATUS.md
            replace_section "SYMCON VISU" VISU_STATUS.md

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add README.md
          git commit -m "Update module status in README [skip ci]" || echo "No changes to commit"
          git push
